<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FM-003 Capsule Proposal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { urds: {900:'#172033',800:'#1f2b3a',accent:'#0ea5a4'} },
          boxShadow: { card: '0 6px 20px rgba(18,26,40,0.06)' }
        }
      }
    }
  </script>

  <style>
    @media print {
      #sidebar, header { display: none !important; }
      body { background: #fff !important; }
      main { max-width: none !important; padding: 0 !important; }
      #previewContent { box-shadow: none !important; border: none !important; padding: 0 !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>

<body class="bg-gray-50 font-inter antialiased">
  <div class="min-h-screen flex">
    <aside id="sidebar" class="w-72 bg-urds-900 text-white shrink-0"></aside>

    <div class="flex-1">
      <header class="bg-white border-b px-6 py-4 flex items-center justify-between">
        <div>
          <h1 class="text-lg font-semibold">FM-003 Capsule Proposal</h1>
          <div class="text-xs text-gray-500">Research Proposal Capsule</div>
        </div>

        <div class="flex gap-2 items-center">
          <button id="printBtn" class="px-3 py-1 bg-urds-900 text-white rounded text-sm">Print / Save PDF</button>
          <button id="backBtn" class="px-3 py-1 bg-gray-100 rounded text-sm">Back</button>
        </div>
      </header>

      <main class="p-6 max-w-5xl mx-auto">
        <div id="previewContent" class="bg-white p-8 rounded-2xl shadow-card">
          <div class="text-center py-10 text-gray-500">Loading...</div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const previewContent = document.getElementById("previewContent");
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id') || localStorage.getItem("viewProposalId");

      document.getElementById("backBtn")?.addEventListener("click", () => history.back());
      document.getElementById("printBtn")?.addEventListener("click", () => window.print());

      if (!id) {
        previewContent.innerHTML = '<div class="text-center py-10 text-gray-500">No proposal selected.</div>';
        return;
      }

      try {
        const response = await fetch(`../../backend/get_proposal.php?id=${encodeURIComponent(id)}`, {
          method: "GET",
          credentials: "include"
        });

        const result = await response.json();

        if (result.status === "success") {
          const p = result.proposal;
          
          previewContent.innerHTML = `
            <div class="text-center mb-6">
              <div class="text-xs text-gray-600">FM-003</div>
              <h1 class="text-xl font-bold mt-2">UNIVERSITY OF EASTERN PHILIPPINES</h1>
              <h2 class="text-lg font-semibold mt-1">RESEARCH PROPOSAL CAPSULE</h2>
            </div>

            <div class="space-y-4 text-sm">
              <div class="grid grid-cols-3 gap-4">
                <div><strong>Title:</strong></div>
                <div class="col-span-2">${escapeHtml(p.title || '')}</div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div><strong>Nature:</strong></div>
                <div class="col-span-2">${escapeHtml(p.nature || '')}</div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div><strong>Research Cluster:</strong></div>
                <div class="col-span-2">${escapeHtml(p.cluster || '')}</div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div><strong>Study Leader:</strong></div>
                <div class="col-span-2">${escapeHtml(p.leader || '')}</div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div><strong>College:</strong></div>
                <div class="col-span-2">${escapeHtml(p.college || '')}</div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div><strong>Department:</strong></div>
                <div class="col-span-2">${escapeHtml(p.department || '')}</div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div><strong>Duration:</strong></div>
                <div class="col-span-2">${escapeHtml(p.duration || '')} months</div>
              </div>

              <div class="grid grid-cols-3 gap-4">
                <div><strong>Budget for the Year:</strong></div>
                <div class="col-span-2">₱ ${formatMoney(p.estimatedBudget || 0)}</div>
              </div>

              <div class="border-t pt-4 mt-6">
                <h3 class="font-semibold mb-2">Rationale / Significance:</h3>
                <div class="whitespace-pre-wrap">${escapeHtml(p.rationale || '')}</div>
              </div>

              <div class="border-t pt-4">
                <h3 class="font-semibold mb-2">Objectives:</h3>
                <div class="whitespace-pre-wrap">${escapeHtml(p.objectives || '')}</div>
              </div>

              <div class="border-t pt-4">
                <h3 class="font-semibold mb-2">Review of Literature:</h3>
                <div class="whitespace-pre-wrap">${escapeHtml(p.literature || '')}</div>
              </div>

              <div class="border-t pt-4">
                <h3 class="font-semibold mb-2">Methodology:</h3>
                <div class="whitespace-pre-wrap">${escapeHtml(p.methodology || '')}</div>
              </div>

              <div class="border-t pt-4">
                <h3 class="font-semibold mb-2">Expected Output:</h3>
                <div class="whitespace-pre-wrap">${escapeHtml(p.expectedOutput || '')}</div>
              </div>

              <div class="border-t pt-4">
                <h3 class="font-semibold mb-2">Impact / Sustainability:</h3>
                <div class="whitespace-pre-wrap">${escapeHtml(p.impact || '')}</div>
              </div>

              <div class="mt-8 pt-4 border-t text-xs text-gray-600">
                <div>Submitted: ${new Date(p.dateSubmitted).toLocaleDateString()}</div>
                <div>Status: ${escapeHtml(p.status || '')}</div>
              </div>
            </div>
          `;
        } else {
          previewContent.innerHTML = `<div class="text-center py-10 text-red-500">Error: ${result.message}</div>`;
        }
      } catch (error) {
        console.error("Error fetching proposal:", error);
        previewContent.innerHTML = `<div class="text-center py-10 text-red-500">Failed to load proposal.</div>`;
      }

      function escapeHtml(s) {
        if (s === null || s === undefined) return "";
        return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
      }

      function formatMoney(n) {
        return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
    });
  </script>
</body>
</html>
