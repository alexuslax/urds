<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evaluator — Evaluation</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { urds: { 900: '#172033', 800: '#1f2b3a', accent: '#0ea5a4' } },
          boxShadow: { card: '0 6px 20px rgba(18,26,40,0.06)' }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-50 font-inter antialiased">
  <div class="min-h-screen flex">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 bg-urds-900 text-white shrink-0"></aside>

    <div class="flex-1">
      <!-- HEADER -->
      <header class="bg-white border-b px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button id="hamburger" class="md:hidden w-10 h-10 bg-gray-100 rounded-md">☰</button>
          <input id="search" class="w-64 bg-gray-50 border px-4 py-2 rounded-lg text-sm" placeholder="Search...">
        </div>

        <a href="profile.html" class="flex items-center gap-3">
          <div class="text-right">
            <div class="user-name text-sm font-medium">User</div>
            <div class="user-role text-xs text-gray-500">Role</div>
          </div>
          <div class="user-initials w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center">U</div>
        </a>
      </header>

      <!-- CONTENT -->
      <main class="p-6 max-w-4xl mx-auto">
        <div class="flex items-start justify-between gap-4 mb-4">
          <div>
            <h1 class="text-2xl font-semibold">Evaluator — CHED Criteria Evaluation</h1>
            <p class="text-sm text-gray-500">Only assigned studies are shown (if assignments exist).</p>
          </div>
          <a href="evaluation_list.html" class="text-sm text-urds-accent underline">Back to assigned list</a>
        </div>

        <!-- Notice / Errors -->
        <div id="noticeBox" class="hidden mb-4"></div>

        <!-- PROPOSAL INFO -->
        <div id="proposalInfo" class="mb-6"></div>

        <!-- EVALUATION FORM -->
        <form id="evalForm" class="bg-white p-6 rounded-2xl shadow-card space-y-5">
          <div>
            <label class="text-sm font-medium">Select Study</label>
            <select id="studySelect" class="w-full border mt-1 px-3 py-2 rounded-lg text-sm"></select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="text-sm font-medium">Evaluator Name</label>
              <input id="evaluatorName" class="w-full border mt-1 px-3 py-2 rounded-lg text-sm" placeholder="Your name">
            </div>

            <div class="bg-gray-50 border rounded-lg px-4 py-3">
              <div class="text-xs text-gray-500">Computed score</div>
              <div class="text-lg font-semibold" id="scoreLine">0.0 / 5.0</div>
              <div class="text-xs text-gray-500" id="scoreHint">Enter ratings to compute.</div>
            </div>
          </div>

          <!-- CHED CRITERIA -->
          <div class="border-t pt-4 space-y-4">
            <h2 class="text-lg font-semibold">CHED Evaluation Criteria (1–5)</h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="text-sm font-medium">Significance</label>
                <input id="crit1" type="number" min="1" max="5" class="w-full sm:w-40 border mt-1 px-3 py-2 rounded-lg text-sm">
              </div>
              <div>
                <label class="text-sm font-medium">Technical Soundness</label>
                <input id="crit2" type="number" min="1" max="5" class="w-full sm:w-40 border mt-1 px-3 py-2 rounded-lg text-sm">
              </div>
              <div>
                <label class="text-sm font-medium">Methodology</label>
                <input id="crit3" type="number" min="1" max="5" class="w-full sm:w-40 border mt-1 px-3 py-2 rounded-lg text-sm">
              </div>
              <div>
                <label class="text-sm font-medium">Ethical Compliance</label>
                <input id="crit4" type="number" min="1" max="5" class="w-full sm:w-40 border mt-1 px-3 py-2 rounded-lg text-sm">
              </div>
              <div>
                <label class="text-sm font-medium">Budget Justification</label>
                <input id="crit5" type="number" min="1" max="5" class="w-full sm:w-40 border mt-1 px-3 py-2 rounded-lg text-sm">
              </div>
            </div>
          </div>

          <!-- COMMENTS -->
          <div>
            <label class="text-sm font-medium">Overall Comments</label>
            <textarea id="comments" class="w-full border mt-1 px-3 py-2 rounded-lg text-sm" rows="4"
              placeholder="Summarize strengths, weaknesses, and recommendations..."></textarea>
          </div>

          <!-- ACTIONS -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <p class="text-xs text-gray-500">Save Draft can be partial. Submit requires complete ratings (1–5).</p>

            <div class="flex gap-2 justify-end">
              <button type="button" id="saveEvalBtn"
                class="px-4 py-2 bg-gray-700 text-white rounded-lg text-sm">
                Save Draft
              </button>
              <button type="button" id="submitEvalBtn"
                class="px-4 py-2 bg-urds-900 text-white rounded-lg text-sm">
                Submit Evaluation
              </button>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/evaluation_evaluator.js"></script>
</body>
</html>
