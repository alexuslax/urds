<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Permissions</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            urds: {
              900: "#172033",
              800: "#1f2b3a",
              accent: "#0ea5a4",
            },
          },
          boxShadow: { card: "0 6px 20px rgba(18,26,40,0.06)" },
        },
      },
    };
  </script>
</head>

<body class="bg-gray-50 font-inter antialiased">

  <div class="min-h-screen flex">

    <!-- SIDEBAR (Auto-generated by main.js) -->
    <aside id="sidebar" class="w-72 bg-urds-900 text-white shrink-0 transition-transform duration-300 lg:translate-x-0 h-screen sticky top-0 overflow-y-auto"></aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1">

      <!-- HEADER -->
      <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">

        <div class="flex items-center gap-3">

          <!-- Mobile hamburger -->
          <button id="hamburger" class="md:hidden flex items-center justify-center w-10 h-10 bg-gray-100 rounded-md">
            ☰
          </button>

          <h1 class="text-xl font-semibold">Permissions Management</h1>

        </div>

        <!-- USER PROFILE (Auto-filled by main.js) -->
        <a id="user-profile-link" class="flex items-center gap-3 cursor-pointer">
          <div class="text-right">
            <div class="text-sm font-medium user-name">Loading...</div>
            <div class="text-xs text-gray-500 user-role">Loading...</div>
          </div>

          <div class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center user-initials">
            U
          </div>
        </a>

      </header>

      <!-- PAGE CONTENT -->
      <main class="p-6">

        <!-- Page Title -->
        <div class="mb-6">
          <h2 class="text-2xl font-semibold">Role-Based Permissions</h2>
          <p class="text-sm text-gray-500">Modify system access for each user role.</p>
        </div>

        <!-- Role Selector -->
        <div class="bg-white rounded-2xl shadow-card p-5 mb-6">
          <label class="text-sm font-medium text-gray-700">Select a Role</label>
          <select class="mt-2 bg-white border border-gray-200 px-3 py-2 rounded-lg text-sm shadow-sm w-full sm:w-72">
            <option>Administrator</option>
            <option>URDS Director</option>
            <option>URDS Staff</option>
            <option>College Dean</option>
            <option>College Research Coordinator</option>
            <option>UREC/R&D Council Member</option>
            <option>Evaluator</option>
            <option>Senior Faculty Researcher (TWG Member)</option>
            <option>Faculty Researcher</option>
          </select>
        </div>

        <!-- Permissions Table -->
        <div class="bg-white rounded-2xl shadow-card overflow-hidden">

          <table class="w-full text-left">
            <thead class="bg-gray-100 text-gray-700 text-sm">
              <tr>
                <th class="px-6 py-3 font-medium">Permission</th>
                <th class="px-6 py-3 font-medium text-center">View</th>
                <th class="px-6 py-3 font-medium text-center">Edit</th>
                <th class="px-6 py-3 font-medium text-center">Delete</th>
                <th class="px-6 py-3 font-medium text-center">Manage</th>
              </tr>
            </thead>

            <tbody class="text-sm">

              <!-- SAMPLE PERMISSION ROW -->
              <tr class="border-t">
                <td class="px-6 py-4 font-medium">User Accounts</td>

                <!-- View -->
                <td class="px-6 py-4 text-center">
                  <input type="checkbox" class="w-4 h-4 accent-urds-accent">
                </td>

                <!-- Edit -->
                <td class="px-6 py-4 text-center">
                  <input type="checkbox" class="w-4 h-4 accent-urds-accent">
                </td>

                <!-- Delete -->
                <td class="px-6 py-4 text-center">
                  <input type="checkbox" class="w-4 h-4 accent-urds-accent">
                </td>

                <!-- Manage -->
                <td class="px-6 py-4 text-center">
                  <input type="checkbox" class="w-4 h-4 accent-urds-accent">
                </td>
              </tr>

              <tr class="border-t">
                <td class="px-6 py-4 font-medium">Colleges</td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
              </tr>

              <tr class="border-t">
                <td class="px-6 py-4 font-medium">System Logs</td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
              </tr>

              <tr class="border-t">
                <td class="px-6 py-4 font-medium">Proposals</td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
                <td class="px-6 py-4 text-center"><input type="checkbox" class="w-4 h-4 accent-urds-accent"></td>
              </tr>

            </tbody>
          </table>

        </div>

        <div class="mt-6 text-right">
          <button class="bg-urds-accent text-white px-5 py-2 rounded-lg shadow hover:opacity-90">
            Save Changes
          </button>
        </div>

      </main>

    </div>
  </div>

  <!-- MAIN JS -->
  <script src="js/main.js"></script>
  <script src="js/admin-permissions.js"></script>

</body>
</html>
